<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>埃及漫游 · Ancient Egypt Travel Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="埃及漫游 —— 一份可离线使用的埃及旅行导览：手绘风地图、24 个景点配图与历史讲解。">
<meta name="theme-color" content="#F5E8C8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="埃及漫游">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="stylesheet" href="/egypt/style.css">
</head>
<body>

<!-- 品牌开屏：图标 + 名称 + 英文小字，淡入淡出 ≤0.7s -->
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <img class="splash-icon" src="icons/splash-icon.png" alt="" width="132" height="132">
    <div class="splash-title">埃及漫游</div>
    <div class="splash-sub">Ancient Egypt · Travel Guide</div>
  </div>
</div>

<!-- 顶栏 -->
<header id="topbar" class="hidden">
  <button id="btn-back" class="icon-btn" type="button" aria-label="返回">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="topbar-title">埃及漫游</h1>
  <button id="btn-search" class="icon-btn" type="button" aria-label="搜索景点">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M15.2 15.2 L20.5 20.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
  </button>
</header>

<!-- 视图容器 -->
<main id="view" class="hidden" role="main"></main>

<!-- 搜索面板 -->
<section id="search-panel" class="hidden" aria-hidden="true">
  <div class="search-head">
    <input id="search-input" type="search" placeholder="搜景点名，中英文都行" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button id="btn-search-close" type="button">取消</button>
  </div>
  <div id="search-results" class="search-results"></div>
</section>

<!-- 回到顶部 -->
<button id="btn-top" class="hidden" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 14 L12 7 L19 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<noscript>
  <p style="padding:24px;font-family:system-ui">「埃及漫游」需要启用 JavaScript 才能运行。</p>
</noscript>

<script src="js/data.js"></script>
<script src="js/credits.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
